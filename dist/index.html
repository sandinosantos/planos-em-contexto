const questions=[
{id:'personalIncome',title:'Qual é a sua renda mensal pessoal aproximada?',why:'Distingue sua renda da soma da família. Considere salários antes de descontos e valores que recebe pessoalmente de negócios, aluguéis ou investimentos. Se varia, use uma média dos últimos meses. Para PJ, não informe o faturamento da empresa: informe sua retirada pessoal, como pró-labore e lucros recebidos.',options:incomeBands},
{id:'income',title:'Qual é a renda mensal aproximada da sua família?',why:'Some as rendas das pessoas que compartilham o orçamento da casa, incluindo a sua. Para quem mora sozinho, pode ser igual à renda pessoal. Não é faturamento empresarial, patrimônio ou renda por pessoa; não calculamos impostos ou benefícios.',options:incomeBands},
{id:'work',title:'Como você descreve sua situação de trabalho?',why:'Ajuda a destacar discussões sobre emprego, jornada, formalização e renda.',options:['Emprego com carteira assinada','Servidor(a) público(a)','PJ prestador(a) de serviços — não MEI','Microempreendedor(a) individual — MEI','Autônomo(a) sem CNPJ','Trabalho informal','Empresário(a) ou sócio(a) de empresa','Buscando emprego','Aposentado(a) ou pensionista','Estudante ou sem atividade remunerada','Outra situação']},
{id:'incomeSources',title:'De onde vem sua renda pessoal?',why:'O mesmo valor mensal pode vir de salário, prestação de serviços, negócio ou patrimônio. Essa resposta ajuda a contextualizar os temas sem presumir que toda renda vem do trabalho. Selecione todas as fontes que recebe; não informamos sua tributação.',multi:true,options:['Salário de emprego ou serviço público','Prestação de serviços como PJ — não MEI','Atividade como MEI','Trabalho autônomo ou informal','Pró-labore, lucros ou dividendos de empresa','Aluguéis','Rendimentos de aplicações financeiras','Aposentadoria ou pensão','Benefícios sociais ou ajuda de outras pessoas','Sem renda pessoal','Outra fonte']},
{id:'family',title:'Como é a composição da sua casa?',why:'Ajuda a contextualizar educação e cuidados. Não pedimos nomes, idades exatas ou informações de saúde.',options:['Moro sozinho(a)','Moro com outras pessoas, sem crianças ou idosos','Há crianças ou adolescentes','Há pessoas idosas','Há crianças ou adolescentes e pessoas idosas']},
{id:'housing',title:'Qual é sua situação de moradia?',why:'Ajuda a relacionar propostas habitacionais com aluguel, financiamento e regularização.',options:['Imóvel alugado','Imóvel próprio financiado','Imóvel próprio quitado','Imóvel cedido ou compartilhado','Moradia com necessidade de regularização']},
{id:'region',title:'Em qual região do Brasil você mora?',why:'Dá contexto territorial à leitura. Uma macrorregião não permite estimar oferta de serviços ou efeitos no seu município.',options:['Norte','Nordeste','Centro-Oeste','Sudeste','Sul','Fora do Brasil']},
{id:'interests',title:'Quais temas você quer ver primeiro?',why:'Sua escolha organiza os cards. Você poderá consultar todos os temas nos resultados.',multi:true,options:topics.map(t=>t.title)}
];
const skip=['Não sei','Prefiro não responder'];const profile={};let step=0;let completed=false;let filters={candidate:'all',topic:'all',type:'all'};
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const known=k=>Array.isArray(profile[k])?profile[k].some(v=>!skip.includes(v)):Boolean(profile[k]&&!skip.includes(profile[k]));
function link(url,label){return `<a class="source-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗<span class="sr"> (abre em nova aba)</span></a>`}
function go(route){if(location.hash==='#'+route)render();else location.hash=route}
function heading(label,title,text){return `<div class="page-head"><a class="back" href="#inicio">← Início</a><div class="eyebrow">${label}</div><h1>${title}</h1><p class="muted">${text}</p></div>`}
function home(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Eleições 2026 · leitura informativa</div><h1>Propostas públicas.<br><em>Impactos possíveis.</em><br>Contexto real.</h1><p class="lead">Explore como planos e declarações de Lula e Flávio Bolsonaro podem se relacionar com diferentes realidades brasileiras.</p><div class="hero-pills"><span>Sem ranking</span><span>Com fontes</span><span>Respostas opcionais</span></div></div><div class="canvas-art" aria-hidden="true"><div class="float-card one"><div class="float-label"><span>PLANO REGISTRADO</span><i class="float-dot"></i></div><div class="mini-lines"><i></i><i></i><i></i></div></div><div class="float-card two"><div class="float-label"><span>SUA REALIDADE</span><span>01</span></div><div class="mini-lines"><i></i><i></i><i></i></div></div><div class="float-card three"><div class="float-label"><span>CONTEXTO + LIMITES</span><i class="float-dot"></i></div><div class="mini-lines"><i></i><i></i></div></div></div></section><div class="actions"><a class="action primary" href="#analise"><div class="icon" aria-hidden="true">01</div><b>${completed?'Revisar análise':'Iniciar análise'}</b><span>Uma pergunta por vez. Cerca de 3 minutos.</span></a><a class="action" href="#metodologia"><div class="icon" aria-hidden="true">02</div><b>Metodologia</b><span>Veja os critérios e os limites da leitura.</span></a><a class="action" href="#fontes"><div class="icon" aria-hidden="true">03</div><b>Fontes</b><span>Abra planos e publicações originais.</span></a></div><div class="promise-grid"><div class="promise"><i>✓</i><div><b>Comparação equilibrada</b><span>A mesma estrutura visual para os dois candidatos.</span></div></div><div class="promise"><i>↗</i><div><b>Origem visível</b><span>Documento, página e link junto de cada resumo.</span></div></div><div class="promise"><i>○</i><div><b>Sem perfil permanente</b><span>As respostas se apagam ao recarregar a página.</span></div></div></div><div class="note">Não é recomendação de voto nem previsão de resultados. A análise usa apenas respostas opcionais, sem nome, CPF ou endereço.</div>${completed?'<p><a href="#resultados">Voltar aos meus resultados →</a></p>':''}<section class="panel feature-panel"><div class="eyebrow">Uma leitura em camadas</div><h2>Menos promessa solta.<br>Mais contexto para decidir.</h2><p class="muted">Cada tema separa plano de governo, declaração oficial, possível relação com o perfil informado e aquilo que os dados não permitem concluir.</p></section>`}
function wizard(){const q=questions[step],selected=profile[q.id]||[];return `<div class="wizard"><a class="back" href="#inicio">← Sair da análise</a><section class="wizard-card"><div class="progress-row"><div class="step-bubble" aria-hidden="true">${String(step+1).padStart(2,'0')}</div><div class="progress-copy"><b role="status">Pergunta ${step+1} de ${questions.length}</b><div class="bar" role="progressbar" aria-label="Progresso das perguntas" aria-valuemin="0" aria-valuemax="${questions.length}" aria-valuenow="${step+1}"><span style="width:${(step+1)/questions.length*100}%"></span></div></div></div><div class="eyebrow">Análise guiada · responda só o que quiser</div><h1 class="question" id="question">${q.title}</h1><p class="why mini"><b>Por que perguntamos:</b> ${q.why}</p>${q.multi?'<p class="mini"><b>'+(q.id==='interests'?'Escolha quantos temas quiser.':'Marque todas as fontes que se aplicam.')+'</b></p>':''}<div class="options" role="group" aria-labelledby="question">${[...q.options,...skip].map(o=>`<label class="option"><input type="${q.multi?'checkbox':'radio'}" name="answer" value="${esc(o)}" ${(q.multi?selected.includes(o):selected===o)?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div><div class="controls"><button class="btn secondary" id="prev">${step?'← Voltar':'← Início'}</button><button class="btn" id="next">${step===questions.length-1?'Ver resultados →':'Avançar →'}</button></div><p class="mini muted">Se avançar sem selecionar, registraremos “Prefiro não responder”.</p></section></div>`}
function reason(t){let arr=[];if(known('interests')&&profile.interests.includes(t.title))arr.push('Você escolheu este tema como interesse.');if(t.id==='work'&&known('work'))arr.push('Situação de trabalho informada: '+profile.work+'.');if(['cost','work'].includes(t.id)&&known('personalIncome'))arr.push('Renda pessoal informada: '+profile.personalIncome+'.');if(t.id==='cost'&&known('income'))arr.push('Renda familiar informada: '+profile.income+'.');if(['cost','work'].includes(t.id)&&known('incomeSources'))arr.push('Origens da renda: '+profile.incomeSources.join(', ')+'.');if(t.id==='housing'){if(known('housing'))arr.push('Moradia informada: '+profile.housing+'.');if(known('income'))arr.push('Faixa de renda familiar: '+profile.income+'.')}if(['education','health'].includes(t.id)&&known('family'))arr.push('Composição da casa: '+profile.family+'.');if(known('region'))arr.push('Região informada: '+profile.region+'; sem estimativa local.');return arr.join(' ')||'Sem informação específica para este tema: mostramos uma leitura geral, sem supor sua situação.'}
function incomeContext(){
 const band=known('personalIncome')?incomeBands.indexOf(profile.personalIncome):-1;
 let text='';
 if(band===0)text='Você informou não ter renda pessoal. A renda familiar, quando informada, oferece outro contexto; não presumimos dependência ou acesso a benefícios.';
 else if(band>0&&band<=2)text='[Interpretação] Para a faixa pessoal informada, discussões sobre renda e despesas essenciais merecem atenção. Não conhecemos seus gastos, número de dependentes ou acesso a políticas públicas.';
 else if(band>=3&&band<=4)text='[Interpretação] Sua faixa pessoal permite uma leitura distinta das rendas acima de R$ 12 mil. O peso do custo de vida ainda depende de despesas, composição da casa e localização.';
 else if(band>=5&&band<=7)text='[Interpretação] Esta leitura distingue sua faixa das rendas de R$ 50 mil ou mais. Vínculo de trabalho e origem dos recebimentos precisam ser considerados separadamente do valor mensal.';
 else if(band>=8)text='[Interpretação] Sua faixa pessoal é tratada separadamente das rendas de R$ 12 mil a R$ 50 mil. Renda elevada não informa patrimônio, composição tributável ou proporção entre trabalho e capital; não atribuímos uma alíquota ou efeito de proposta a você.';
 else text='Renda pessoal não informada: não classificamos seu nível de renda pela soma familiar.';
 if(known('work')&&profile.work==='PJ prestador(a) de serviços — não MEI')text+=' [Interpretação] Você informou prestação de serviços como PJ não MEI. Não aplicamos automaticamente regras de emprego com carteira ou de MEI; o contrato e o regime da empresa não foram informados.';
 if(known('incomeSources'))text+=' Fontes informadas: '+profile.incomeSources.join(', ')+'. Não presumimos que todos os recebimentos tenham o mesmo tratamento.';
 return text;
}
function relation(t){return {work:'[Interpretação] As propostas tratam de remuneração, contratação e jornada. A relação com sua rotina depende do vínculo de trabalho e das regras aplicáveis à categoria.',cost:'[Interpretação] Tributos, preços e políticas de renda podem dialogar com o orçamento familiar. A faixa informada não permite prever quanto você ganharia ou economizaria.',housing:'[Interpretação] Acesso à habitação e regularização podem ser pertinentes a quem aluga, financia ou busca regularizar a moradia. Isso não constitui análise de elegibilidade.',health:'[Interpretação] Políticas de atendimento e cuidados podem ser relevantes para diferentes arranjos familiares. Não inferimos necessidade de tratamento ou dependência.',education:'[Interpretação] Formação profissional e educação podem se relacionar com estudos e cuidados familiares. Não presumimos que alguém da casa precise de uma vaga.',security:'[Interpretação] Segurança pública afeta a vida coletiva. A região informada serve apenas como contexto, sem atribuir risco pessoal.'}[t.id]}
function statementCard(s){return `<span class="badge">Declaração oficial</span><p>${s.text}</p><details><summary>Autor, data e contexto</summary><p><b>Autor:</b> ${s.author}</p><p><b>Publicação:</b> ${s.date}</p><p><b>Contexto:</b> ${s.context}</p><p class="muted">Resumo editorial, sem citação direta. Conteúdo de canal ligado ao candidato; verificação da publicação não confirma a realização da promessa.</p></details>${link(s.url,'Abrir publicação original')}`}
function candidate(t,c){const ss=statements.filter(s=>s.candidate===c&&s.topic===t.id);return `<section class="candidate"><div class="candidate-head"><span class="candidate-mark" aria-hidden="true">${c==='lula'?'L':'FB'}</span><div><h4>${names[c]}</h4><span class="badge">Plano de governo</span></div></div><p>${t[c]}</p>${link(plans[c]+'#page='+ (c==='lula'?t.lp:t.fp).split(/[–;]/)[0],'TSE · PDF, páginas '+(c==='lula'?t.lp:t.fp))}<div class="statement">${ss.length?ss.map(statementCard).join(''):'<span class="badge">Declaração oficial</span><p class="muted">Não localizado nesta revisão para este tema.</p><p class="mini muted">Isso não significa que o candidato não tenha se manifestado.</p>'}</div></section>`}
function results(){const ordered=[...topics].sort((a,b)=>Number((profile.interests||[]).includes(b.title))-Number((profile.interests||[]).includes(a.title)));return `${heading('Sua leitura em contexto','Explore um tema de cada vez.','Abra os cards para comparar propostas, declarações, relações possíveis e limites. Nenhum tema estima ganho pessoal ou resultado de governo.')}<div class="profile">${questions.filter(q=>known(q.id)).map(q=>`<span>${esc(({personalIncome:'Renda pessoal',income:'Renda familiar',work:'Trabalho',incomeSources:'Origem da renda',family:'Casa',housing:'Moradia',region:'Região',interests:'Interesses'}[q.id])+': '+(q.multi?profile[q.id].join(', '):profile[q.id]))}</span>`).join('')||'<span>Perfil não informado · leitura geral</span>'}</div><div class="controls" style="margin:0 0 18px;flex-wrap:wrap"><a class="btn secondary" href="#analise">Revisar respostas</a><button class="btn secondary" id="clear">Apagar respostas</button></div><div class="note" style="margin-bottom:18px">Os temas escolhidos aparecem primeiro. Não há pontuação, ranking ou recomendação de candidato.</div><div class="topics">${ordered.map((t,i)=>`<details class="topic" ${i===0?'open':''}><summary class="topic-summary"><span class="topic-index">${String(i+1).padStart(2,'0')}</span><span class="topic-title"><h2>${t.title}</h2><span>${(profile.interests||[]).includes(t.title)?'Tema escolhido por você':'Leitura complementar'} · toque para ${i===0?'recolher':'comparar'}</span></span></summary><div class="topic-body"><div class="context"><b>Seu contexto</b><p>${esc(reason(t))}</p></div><div class="compare">${candidate(t,'lula')}${candidate(t,'flavio')}</div><details class="limits"><summary>Possível relação e limites da leitura</summary><p class="mini">${relation(t)}</p>${['cost','work'].includes(t.id)?'<p class="mini">'+esc(incomeContext())+'</p>':''}<div class="uncertain"><b>Incerteza · o que esta leitura não permite concluir</b><p>${t.limit}</p><p>Um compromisso documentado não é um resultado assegurado. Custos, prazos, regulamentação e execução podem alterar o alcance da proposta.</p></div></details></div></details>`).join('')}</div>`}
function method(){return `${heading('Critérios editoriais','Como esta leitura é construída.','Informação rastreável, interpretação identificada e limites à vista.')}<div class="method-grid">${[
['01 · Suas respostas','Distinguimos renda pessoal e familiar em 11 faixas, de ausência de renda a mais de R$ 250 mil por mês. Os intervalos são recortes editoriais, não uma classificação oficial de classe social. Usamos valores para contexto orçamentário; origem dos recebimentos para distinguir trabalho, negócios e patrimônio; trabalho para jornada e emprego; família para educação e cuidados; moradia para habitação; região para contexto territorial. Interesses ordenam os cards. Respostas omitidas geram leitura geral, sem preencher lacunas.'],
['02 · Mesma régua para ambos','Comparamos compromissos por tema nos planos de 2026 publicados pelo TSE. Resumos não são citações. O recorte não substitui os documentos completos e não equivale a endosso do TSE às propostas.'],
['03 · Tipos de informação','Plano de governo identifica o documento eleitoral. Declaração oficial identifica fala ou comunicação publicada em canal oficial, com autoria, data disponível e contexto. Comunicação de campanha não é apresentada como transcrição pessoal.'],
['04 · Relevância sem previsão','A relevância depende do tema escolhido ou de uma resposta expressamente informada. A possível relação aparece como interpretação. Não há cálculo de benefício, preferência partidária inferida, ranking ou recomendação de voto.'],
['05 · Lacunas e incertezas','Não localizado significa que a revisão não encontrou uma declaração confiável para aquele candidato e tema. Não demonstra ausência de posição. Diferenciamos intenção, aprovação de lei, financiamento e implementação; não presumimos resultados.'],
['06 · Fontes e atualização','Priorizamos os planos registrados no TSE e canais dos candidatos ou partidos. São fontes para compromissos e manifestações, não validação independente de suas alegações. Fontes jornalísticas, se usadas, devem ser identificadas como contexto. Nesta versão, os cards usam TSE e canais oficiais. Revisão: 11/10/2026; sem atualização automática.'],
['07 · Privacidade','As respostas são processadas na memória do navegador. O código da análise não envia respostas, não usa cookies nem as guarda em armazenamento local. Recarregar ou apagar respostas remove esse perfil. Links externos têm suas próprias políticas; a hospedagem e o acesso ao site podem registrar dados técnicos.'],
['08 · Escopo','A análise é informativa: não prevê o que acontecerá, não recomenda voto e não apresenta promessas como efeitos certos. O conjunto de temas e declarações é um recorte editorial, com cobertura que pode variar conforme as fontes localizadas.']
].map(([h,p])=>`<section class="panel"><h3>${h}</h3><p class="muted">${p}</p></section>`).join('')}</div><p style="margin-top:25px"><a class="btn" href="#analise">Iniciar análise →</a></p>`}
function sourceRecords(){return [...Object.keys(names).flatMap(c=>topics.map(t=>({candidate:c,topic:t.id,type:'plan',title:'Plano de governo 2027–2030 · '+t.title,date:'Eleições 2026; data de publicação não informada nesta revisão',meta:'TSE · páginas '+(c==='lula'?t.lp:t.fp),url:plans[c]+'#page='+(c==='lula'?t.lp:t.fp).split(/[–;]/)[0]}))),...statements.map(s=>({...s,type:'statement',meta:s.author+' · '+s.context}))]}
function sources(){const records=sourceRecords().filter(s=>(filters.candidate==='all'||s.candidate===filters.candidate)&&(filters.topic==='all'||s.topic===filters.topic)&&(filters.type==='all'||s.type===filters.type));return `${heading('Documentos e publicações','Abra a fonte. Leia no original.','Filtre por candidato, tema e tipo. Os links dos planos apontam para o mesmo documento, em páginas relacionadas a cada tema.')}<div class="filters">${[['candidate','Candidato',[['all','Todos'],...Object.entries(names)]],['topic','Tema',[['all','Todos'],...topics.map(t=>[t.id,t.title])]],['type','Tipo',[['all','Todos'],['plan','Plano de governo'],['statement','Declaração oficial']]]].map(([id,label,opts])=>`<label>${label}<select data-filter="${id}">${opts.map(([v,n])=>`<option value="${v}" ${filters[id]===v?'selected':''}>${n}</option>`).join('')}</select></label>`).join('')}</div><p class="mini muted" role="status">${records.length} referências · consultadas em 11/10/2026</p><div class="sources">${records.map(s=>`<article class="panel"><div class="eyebrow">${names[s.candidate]} · ${topics.find(t=>t.id===s.topic).title}</div><h3>${s.title}</h3><span class="badge">${s.type==='plan'?'Plano de governo':'Declaração oficial'}</span><p class="source-meta">${s.date}</p><p class="mini muted">${s.meta}</p>${link(s.url,'Abrir fonte original')}</article>`).join('')||'<p>Nenhuma fonte corresponde a esses filtros.</p>'}</div><div class="note" style="margin-top:25px">Datas de publicação não são automaticamente datas da fala. “Não localizado” nos cards registra uma lacuna da revisão, sem criar links ou atribuições. Para os planos, consulte também ${link(root+'propostas-de-governo-dos-candidatos-ao-cargo-de-presidente-da-republica-eleicoes-2026-segundo-turno','o índice oficial do TSE')}.</div>`}
function render(focus=true){let route=location.hash.slice(1)||'inicio';if(route==='resultados'&&!completed){route='analise'}app.innerHTML=({inicio:home,analise:wizard,resultados:results,metodologia:method,fontes:sources}[route]||home)();document.querySelectorAll('.nav a').forEach(a=>a.setAttribute('aria-current',a.hash==='#'+route?'page':'false'));if(focus){app.focus({preventScroll:true});window.scrollTo(0,0)}document.title=(route==='inicio'?'Planos em Contexto':({analise:'Análise guiada',resultados:'Seus resultados',metodologia:'Metodologia',fontes:'Lista de fontes'}[route]||'Início')+' · Planos em Contexto');}
app.addEventListener('change',e=>{if(e.target.dataset.filter){filters[e.target.dataset.filter]=e.target.value;render(false);app.querySelector(`[data-filter="${e.target.dataset.filter}"]`).focus();return}if(e.target.name==='answer'){let q=questions[step];if(q.multi){let values=[...app.querySelectorAll('input:checked')].map(x=>x.value);if(skip.includes(e.target.value)&&e.target.checked)values=[e.target.value];else if(e.target.checked)values=values.filter(v=>!skip.includes(v));if(q.id==='incomeSources'){if(e.target.value==='Sem renda pessoal'&&e.target.checked)values=['Sem renda pessoal'];else if(e.target.checked)values=values.filter(v=>v!=='Sem renda pessoal');}profile[q.id]=values;app.querySelectorAll('input').forEach(x=>x.checked=values.includes(x.value))}else profile[q.id]=e.target.value;}});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='prev'){if(step){step--;render()}else go('inicio')}if(b.id==='next'){const q=questions[step];if(!profile[q.id]||profile[q.id].length===0)profile[q.id]=q.multi?['Prefiro não responder']:'Prefiro não responder';if(step<questions.length-1){step++;render()}else{completed=true;go('resultados')}}if(b.id==='clear'){Object.keys(profile).forEach(k=>delete profile[k]);completed=false;step=0;go('inicio')}});
document.querySelector('.brand').addEventListener('click',()=>go('inicio'));window.addEventListener('hashchange',()=>render());render(false);
</script></body></html>
